<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario DOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cadastro</h1>
    <form id="formCadastro">
        <label for="nome">Nome</label>
        <input type="text" nome="nome" id="nome" placeholder="Digite o seu nome">

        <label for="email">E-mail</label>
        <input type="email" nome="email" id="email"
        placeholder="Digite seu E-mail">

        <label for="idade">idade</label>
        <input type="number" nome="idade" id="idade" min="0"
        max="99">

        <label>Sexo</label>
        <div class="grupo-radio">
            <label><input type="radio" name="Sexo" id="Sexo" value="feminino">Feminino</label>
             <label><input type="radio" name="Sexo" id="Sexo" value="masculino">Masculino</label>
        </div>

        <label>Interesses</label>
        <div class="grupo-box"><label><input type="checkbox" name="Interesses" id="esporte">Esporte</label>
        <label><input type="checkbox" name="Interesses" id="musicas">Musicas</label>
        <label><input type="checkbox" name="Interesses" id="jogos">Jogos</label>
        </div>

        <label for="mensagem">Mensagem (Max.100 caracteres)</label>
        <textarea id="mensagem" maxlength="100"></textarea>
        <div id="contador">0 / 100</div>

        <button type="submit">Enviar Cadastro</button>
    </form>

    <div id="mensagem-envio"></div>
</body>
</html>
